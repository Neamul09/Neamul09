<svg width="410" height="230" viewBox="0 0 410 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="410" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#1c070a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="c1-accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#FF5A60" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", "Fira Code", monospace; }
  </style>

  <!-- Card Base -->
  <rect width="410" height="230" rx="8" fill="url(#c1-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Code Pattern / Graphic Accent -->
  <g opacity="0.12" fill="#E50914">
    <circle cx="340" cy="80" r="60" />
    <path d="M 280 40 L 320 20 L 360 40 L 340 70 Z" />
  </g>

  <!-- Badges Row -->
  <g transform="translate(18, 16)">
    <!-- Red N -->
    <path d="M 0 0 L 5 0 L 5 18 L 0 18 Z" fill="#E50914" />
    <path d="M 10 0 L 15 0 L 15 18 L 10 18 Z" fill="#E50914" />
    <path d="M 0 0 L 15 18 L 10 18 L 0 5 Z" fill="#B81D24" />
    <text x="22" y="14" fill="#E50914" class="font-heavy" font-size="11" letter-spacing="2">SERIES</text>

    <!-- Top 10 Badge -->
    <rect x="290" y="0" width="80" height="20" rx="3" fill="#E50914" />
    <text x="330" y="14" fill="#FFFFFF" class="font-sans" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1">TOP 10</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(18, 75)">
    <text x="0" y="32" fill="#FFFFFF" class="font-heavy" font-size="28" letter-spacing="-0.5">CHOLOSIKHI</text>
    <text x="0" y="54" fill="#AAAAAA" class="font-sans" font-size="12" font-weight="500">Duolingo-Style Gamified Coding Platform</text>

    <!-- Match & Specs -->
    <g transform="translate(0, 76)">
      <text x="0" y="12" fill="#46D369" class="font-sans" font-weight="800" font-size="12.5">99% Match</text>
      <rect x="78" y="0" width="68" height="16" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <text x="112" y="12" fill="#DDD" class="font-sans" font-weight="600" font-size="9.5" text-anchor="middle">React 19 • TS</text>
      <rect x="152" y="0" width="70" height="16" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <text x="187" y="12" fill="#DDD" class="font-sans" font-weight="600" font-size="9.5" text-anchor="middle">Supabase</text>
    </g>
  </g>

  <!-- Netflix Progress Bar (Bottom) -->
  <rect x="0" y="224" width="410" height="6" fill="#333333" />
  <rect x="0" y="224" width="375" height="6" fill="#E50914" />
</svg>
