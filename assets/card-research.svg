<svg width="830" height="195" viewBox="0 0 830 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="830" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#1c070a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="paper-title" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", "Fira Code", monospace; }
  </style>

  <!-- Card Base -->
  <rect width="830" height="195" rx="8" fill="url(#cr-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Neural Network Vector Background Decoration -->
  <g opacity="0.1" stroke="#E50914" stroke-width="1.5">
    <circle cx="700" cy="50" r="15" fill="#E50914" />
    <circle cx="780" cy="90" r="18" fill="#E50914" />
    <circle cx="680" cy="130" r="12" fill="#E50914" />
    <circle cx="750" cy="160" r="14" fill="#E50914" />
    <line x1="700" y1="50" x2="780" y2="90" />
    <line x1="700" y1="50" x2="680" y2="130" />
    <line x1="780" y1="90" x2="680" y2="130" />
    <line x1="680" y1="130" x2="750" y2="160" />
    <line x1="780" y1="90" x2="750" y2="160" />
  </g>

  <!-- Badges Row -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="145" height="20" rx="3" fill="#E50914" />
    <text x="72" y="14" fill="#FFFFFF" class="font-sans" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">CRITICALLY ACCLAIMED</text>

    <rect x="155" y="0" width="85" height="20" rx="3" fill="#222" stroke="#444" stroke-width="1" />
    <text x="197" y="14" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="10" text-anchor="middle">ELSEVIER</text>

    <text x="252" y="14" fill="#888888" class="font-sans" font-size="11">In Silico Research in Biomedicine</text>
  </g>

  <!-- Paper Title & Synopsis -->
  <g transform="translate(24, 75)">
    <text x="0" y="24" fill="#FFFFFF" class="font-heavy" font-size="22" letter-spacing="-0.5">
      Diabetic Foot Ulcer Identification &amp; Localization Using Faster R-CNN
    </text>
    <text x="0" y="46" fill="#AAAAAA" class="font-sans" font-size="12">
      Co-authored Deep Learning &amp; Computer Vision research for high-accuracy clinical wound diagnostic localization.
    </text>

    <!-- Meta Details -->
    <g transform="translate(0, 68)">
      <text x="0" y="12" fill="#46D369" class="font-sans" font-weight="800" font-size="13">98% Match</text>
      <rect x="85" y="0" width="95" height="17" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <text x="132" y="12" fill="#DDD" class="font-sans" font-weight="600" font-size="10" text-anchor="middle">ScienceDirect PII</text>
      <text x="195" y="12" fill="#888" class="font-sans" font-size="11">Authors: Rifat, Nayeem, <tspan fill="#E50914" font-weight="700">Neon</tspan>, Nur-A-Alam</text>
    </g>
  </g>

  <!-- Watch Bar (100% Completed) -->
  <rect x="0" y="189" width="830" height="6" fill="#333333" />
  <rect x="0" y="189" width="830" height="6" fill="#E50914" />
</svg>
