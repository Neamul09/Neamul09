<svg width="800" height="205" viewBox="0 0 800 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="800" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#1c070a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Card Base -->
  <rect width="800" height="205" rx="8" fill="url(#cr-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Neural Network Vector Background Decoration -->
  <g opacity="0.12" stroke="#E50914" stroke-width="1.5">
    <circle cx="670" cy="50" r="14" fill="#E50914" />
    <circle cx="745" cy="85" r="16" fill="#E50914" />
    <circle cx="650" cy="125" r="12" fill="#E50914" />
    <circle cx="720" cy="155" r="13" fill="#E50914" />
    <line x1="670" y1="50" x2="745" y2="85" />
    <line x1="670" y1="50" x2="650" y2="125" />
    <line x1="745" y1="85" x2="650" y2="125" />
    <line x1="650" y1="125" x2="720" y2="155" />
    <line x1="745" y1="85" x2="720" y2="155" />
  </g>

  <!-- Badges Row -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="145" height="20" rx="3" fill="#E50914" />
    <text x="72" y="14" fill="#FFFFFF" class="font-sans" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">CRITICALLY ACCLAIMED</text>

    <rect x="155" y="0" width="85" height="20" rx="3" fill="#222" stroke="#444" stroke-width="1" />
    <text x="197" y="14" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="10" text-anchor="middle">ELSEVIER</text>

    <text x="252" y="14" fill="#888888" class="font-sans" font-size="11">In Silico Research in Biomedicine</text>
  </g>

  <!-- Paper Title & Synopsis -->
  <g transform="translate(24, 68)">
    <text x="0" y="24" fill="#FFFFFF" class="font-heavy" font-size="20" letter-spacing="-0.5">
      Diabetic Foot Ulcer Identification &amp; Localization Using Faster R-CNN
    </text>
    <text x="0" y="46" fill="#AAAAAA" class="font-sans" font-size="12">
      Co-authored Deep Learning &amp; Computer Vision research for high-accuracy clinical wound localization.
    </text>

    <!-- Meta Details & Read Button -->
    <g transform="translate(0, 68)">
      <text x="0" y="15" fill="#46D369" class="font-sans" font-weight="800" font-size="13">98% Match</text>
      <rect x="85" y="2" width="95" height="18" rx="2" fill="#222" stroke="#444" stroke-width="1" />
      <text x="132" y="15" fill="#DDD" class="font-sans" font-weight="600" font-size="10" text-anchor="middle">ScienceDirect PII</text>
      <text x="195" y="15" fill="#888" class="font-sans" font-size="11">Authors: Rifat, Nayeem, <tspan fill="#E50914" font-weight="700">Neon</tspan>, Nur-A-Alam</text>

      <!-- Action Pill Button -->
      <g transform="translate(530, -5)">
        <rect width="215" height="30" rx="4" fill="#E50914" />
        <text x="107" y="19" fill="#FFFFFF" class="font-sans" font-weight="700" font-size="11.5" text-anchor="middle">▶ Read on ScienceDirect</text>
      </g>
    </g>
  </g>

  <!-- Watch Bar (100% Completed) -->
  <rect x="0" y="199" width="800" height="6" fill="#333333" />
  <rect x="0" y="199" width="800" height="6" fill="#E50914" />
</svg>
