<svg width="800" height="120" viewBox="0 0 800 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="conn-bg" x1="0" y1="0" x2="800" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #FFFFFF; }
  </style>

  <rect width="800" height="120" rx="8" fill="url(#conn-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Subtitle -->
  <text x="400" y="30" fill="#AAAAAA" class="font-sans" font-size="12" text-anchor="middle">Ready to build the next blockbuster project? Connect anytime.</text>

  <!-- 4 Netflix Buttons -->
  <g transform="translate(45, 52)">
    <!-- Button 1: LinkedIn -->
    <g>
      <rect width="160" height="42" rx="4" fill="#0A66C2" />
      <text x="80" y="26" class="btn-text" text-anchor="middle">▶ LinkedIn</text>
    </g>

    <!-- Button 2: CholoSikhi -->
    <g transform="translate(180, 0)">
      <rect width="170" height="42" rx="4" fill="#E50914" />
      <text x="85" y="26" class="btn-text" text-anchor="middle">▶ CholoSikhi.com</text>
    </g>

    <!-- Button 3: Email -->
    <g transform="translate(365, 0)">
      <rect width="160" height="42" rx="4" fill="#222222" stroke="#444444" stroke-width="1" />
      <text x="80" y="26" class="btn-text" text-anchor="middle">✉ Email Me</text>
    </g>

    <!-- Button 4: GitHub -->
    <g transform="translate(540, 0)">
      <rect width="160" height="42" rx="4" fill="#181818" stroke="#444444" stroke-width="1" />
      <text x="80" y="26" class="btn-text" text-anchor="middle">★ GitHub Profile</text>
    </g>
  </g>
</svg>
