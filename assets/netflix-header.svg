<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="850" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="45%" stop-color="#141414" />
      <stop offset="100%" stop-color="#2a0508" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="425" y1="0" x2="425" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <linearGradient id="red-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B81D24" />
    </linearGradient>
    <filter id="shadow" x="-10" y="-10" width="870" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    .neon-pulse { animation: pulse 3s infinite ease-in-out; }
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", "Fira Code", Menlo, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="380" rx="12" fill="url(#bg-grad)" />
  <rect width="850" height="380" rx="12" fill="url(#glow-grad)" />
  <rect x="0.5" y="0.5" width="849" height="379" rx="11.5" stroke="#333333" stroke-opacity="0.6" />

  <!-- Top Navigation Bar -->
  <g id="navbar">
    <!-- Netflix Style N Logo -->
    <path d="M 35 22 L 44 22 L 44 52 L 35 52 Z" fill="#E50914" />
    <path d="M 52 22 L 61 22 L 61 52 L 52 52 Z" fill="#E50914" />
    <path d="M 35 22 L 61 52 L 52 52 L 35 30 Z" fill="#B81D24" opacity="0.95" />

    <text x="75" y="42" fill="#E50914" class="font-heavy" font-size="20" letter-spacing="4">NEON</text>

    <!-- Nav Links -->
    <text x="160" y="41" fill="#FFFFFF" class="font-sans" font-weight="600" font-size="13">Home</text>
    <rect x="160" y="47" width="36" height="2" fill="#E50914" rx="1" />
    <text x="220" y="41" fill="#AAAAAA" class="font-sans" font-size="13">Originals</text>
    <text x="300" y="41" fill="#AAAAAA" class="font-sans" font-size="13">Research</text>
    <text x="385" y="41" fill="#AAAAAA" class="font-sans" font-size="13">Tech Stack</text>
    <text x="480" y="41" fill="#AAAAAA" class="font-sans" font-size="13">Contact</text>

    <!-- Right Profile Avatar -->
    <rect x="785" y="24" width="30" height="30" rx="5" fill="#E50914" />
    <!-- Smiley Face -->
    <circle cx="795" cy="34" r="2" fill="#FFFFFF" />
    <circle cx="805" cy="34" r="2" fill="#FFFFFF" />
    <path d="M 794 42 Q 800 47 806 42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Hero Content Area -->
  <g transform="translate(40, 85)">
    <!-- Original Series Badge -->
    <g>
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#E50914" />
      <text x="65" y="14" fill="#FFFFFF" class="font-sans" font-weight="800" font-size="9.5" text-anchor="middle" letter-spacing="2">A NEON ORIGINAL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#title-grad)" class="font-heavy" font-size="52" letter-spacing="-1">CHOLOSIKHI</text>

    <!-- Meta Tags Row -->
    <g transform="translate(0, 95)">
      <!-- 99% Match in Netflix Green -->
      <text x="0" y="14" fill="#46D369" class="font-sans" font-weight="800" font-size="14">99% Match</text>
      <!-- Year -->
      <rect x="90" y="1" width="46" height="18" rx="3" fill="#222222" stroke="#444444" stroke-width="1" />
      <text x="113" y="14" fill="#E5E5E5" class="font-sans" font-weight="600" font-size="11" text-anchor="middle">2026</text>
      <!-- TV-MA -->
      <rect x="144" y="1" width="56" height="18" rx="3" fill="#222222" stroke="#444444" stroke-width="1" />
      <text x="172" y="14" fill="#E5E5E5" class="font-sans" font-weight="600" font-size="11" text-anchor="middle">TV-MA</text>
      <!-- Ultra HD 4K -->
      <rect x="208" y="1" width="92" height="18" rx="3" fill="#E50914" />
      <text x="254" y="14" fill="#FFFFFF" class="font-sans" font-weight="800" font-size="10" text-anchor="middle" letter-spacing="1">ULTRA HD 4K</text>
      <!-- Stars -->
      <text x="315" y="14" fill="#F59E0B" class="font-sans" font-size="13">★★★★★</text>
    </g>

    <!-- Synopsis -->
    <text x="0" y="145" fill="#E5E5E5" class="font-sans" font-size="14" font-weight="400">
      <tspan x="0" dy="0">Founder of CholoSikhi — an interactive, bilingual gamified coding platform built in</tspan>
      <tspan x="0" dy="22">Duolingo style. Features interactive DSA visualizers, XP streaks, and practice sandboxes.</tspan>
    </text>

    <!-- Buttons Row -->
    <g transform="translate(0, 205)">
      <!-- Play Button (White with Black Text) -->
      <g>
        <rect x="0" y="0" width="165" height="38" rx="4" fill="#FFFFFF" />
        <path d="M 22 13 L 34 19 L 22 25 Z" fill="#000000" />
        <text x="45" y="24" fill="#000000" class="font-sans" font-weight="700" font-size="14">Launch Platform</text>
      </g>

      <!-- More Info Button (Dark Translucent with White Text) -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="140" height="38" rx="4" fill="#333333" fill-opacity="0.8" stroke="#555555" stroke-width="1" />
        <circle cx="24" cy="19" r="8" fill="none" stroke="#FFFFFF" stroke-width="2" />
        <text x="24" y="23" fill="#FFFFFF" class="font-sans" font-weight="700" font-size="12" text-anchor="middle">i</text>
        <text x="42" y="24" fill="#FFFFFF" class="font-sans" font-weight="600" font-size="14">More Info</text>
      </g>
    </g>
  </g>

  <!-- Ambient Glow Circle in Bottom Right -->
  <circle cx="780" cy="300" r="140" fill="#E50914" opacity="0.08" filter="url(#shadow)" />
</svg>
