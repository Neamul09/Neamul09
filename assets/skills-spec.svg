<svg width="800" height="230" viewBox="0 0 800 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="800" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .label { fill: #888888; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag { fill: #E5E5E5; font-size: 12px; font-weight: 500; }
  </style>

  <rect width="800" height="230" rx="8" fill="url(#sk-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Section Title -->
  <g transform="translate(24, 25)">
    <text x="0" y="0" fill="#FFFFFF" class="font-heavy" font-size="15" letter-spacing="0.5">TECHNICAL SPECIFICATIONS &amp; CAST</text>
    <line x1="0" y1="12" x2="752" y2="12" stroke="#262626" stroke-width="1" />
  </g>

  <!-- Row 1: Languages -->
  <g transform="translate(24, 60)">
    <text x="0" y="14" class="font-sans label">Original Languages:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="75" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="37" y="14" class="font-sans tag" font-size="11" text-anchor="middle">TypeScript</text>

      <rect x="82" y="0" width="75" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="119" y="14" class="font-sans tag" font-size="11" text-anchor="middle">JavaScript</text>

      <rect x="164" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="194" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Python</text>

      <rect x="231" y="0" width="46" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="254" y="14" class="font-sans tag" font-size="11" text-anchor="middle">C++</text>

      <rect x="284" y="0" width="46" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="307" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Dart</text>

      <rect x="337" y="0" width="46" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="360" y="14" class="font-sans tag" font-size="11" text-anchor="middle">SQL</text>
    </g>
  </g>

  <!-- Row 2: Frontend & Motion -->
  <g transform="translate(24, 100)">
    <text x="0" y="14" class="font-sans label">Frontend &amp; Motion:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="65" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="32" y="14" class="font-sans tag" font-size="11" text-anchor="middle">React 19</text>

      <rect x="72" y="0" width="75" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="109" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Next.js 16</text>

      <rect x="154" y="0" width="95" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="201" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Tailwind CSS 4</text>

      <rect x="256" y="0" width="95" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="303" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Framer Motion</text>

      <rect x="358" y="0" width="45" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="380" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Vite</text>
    </g>
  </g>

  <!-- Row 3: Backend & Database -->
  <g transform="translate(24, 140)">
    <text x="0" y="14" class="font-sans label">Cloud &amp; Databases:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="90" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="45" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Supabase RLS</text>

      <rect x="97" y="0" width="80" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="137" y="14" class="font-sans tag" font-size="11" text-anchor="middle">PostgreSQL</text>

      <rect x="184" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="214" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Node.js</text>

      <rect x="251" y="0" width="80" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="291" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Prisma ORM</text>
    </g>
  </g>

  <!-- Row 4: Mobile & Tooling -->
  <g transform="translate(24, 180)">
    <text x="0" y="14" class="font-sans label">Mobile &amp; Studios:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="55" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="27" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Flutter</text>

      <rect x="62" y="0" width="38" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="81" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Git</text>

      <rect x="107" y="0" width="55" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="134" y="14" class="font-sans tag" font-size="11" text-anchor="middle">GitHub</text>

      <rect x="169" y="0" width="52" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="195" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Vercel</text>

      <rect x="228" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="258" y="14" class="font-sans tag" font-size="11" text-anchor="middle">VS Code</text>

      <rect x="295" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="320" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Linux</text>
    </g>
  </g>
</svg>
