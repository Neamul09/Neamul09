<svg width="830" height="230" viewBox="0 0 830 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="830" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .label { fill: #888888; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag { fill: #E5E5E5; font-size: 13px; font-weight: 500; }
  </style>

  <rect width="830" height="230" rx="8" fill="url(#sk-bg)" stroke="#2b2b2b" stroke-width="1" />

  <!-- Section Title -->
  <g transform="translate(24, 25)">
    <text x="0" y="0" fill="#FFFFFF" class="font-heavy" font-size="16" letter-spacing="0.5">TECHNICAL SPECIFICATIONS &amp; CAST</text>
    <line x1="0" y1="12" x2="782" y2="12" stroke="#262626" stroke-width="1" />
  </g>

  <!-- Row 1: Languages -->
  <g transform="translate(24, 60)">
    <text x="0" y="14" class="font-sans label">Original Languages:</text>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="75" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="37" y="14" class="font-sans tag" font-size="11" text-anchor="middle">TypeScript</text>

      <rect x="85" y="0" width="75" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="122" y="14" class="font-sans tag" font-size="11" text-anchor="middle">JavaScript</text>

      <rect x="170" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="200" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Python</text>

      <rect x="240" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="265" y="14" class="font-sans tag" font-size="11" text-anchor="middle">C++</text>

      <rect x="300" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="325" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Dart</text>

      <rect x="360" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="385" y="14" class="font-sans tag" font-size="11" text-anchor="middle">SQL</text>
    </g>
  </g>

  <!-- Row 2: Frontend & Motion -->
  <g transform="translate(24, 100)">
    <text x="0" y="14" class="font-sans label">Frontend &amp; Motion:</text>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="70" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="35" y="14" class="font-sans tag" font-size="11" text-anchor="middle">React 19</text>

      <rect x="80" y="0" width="80" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="120" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Next.js 16</text>

      <rect x="170" y="0" width="95" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="217" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Tailwind CSS 4</text>

      <rect x="275" y="0" width="95" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="322" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Framer Motion</text>

      <rect x="380" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="405" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Vite</text>
    </g>
  </g>

  <!-- Row 3: Backend & Database -->
  <g transform="translate(24, 140)">
    <text x="0" y="14" class="font-sans label">Cloud &amp; Databases:</text>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="90" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="45" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Supabase RLS</text>

      <rect x="100" y="0" width="80" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="140" y="14" class="font-sans tag" font-size="11" text-anchor="middle">PostgreSQL</text>

      <rect x="190" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="220" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Node.js</text>

      <rect x="260" y="0" width="80" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="300" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Prisma ORM</text>
    </g>
  </g>

  <!-- Row 4: Mobile & Tooling -->
  <g transform="translate(24, 180)">
    <text x="0" y="14" class="font-sans label">Mobile &amp; Studios:</text>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="30" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Flutter</text>

      <rect x="70" y="0" width="40" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="90" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Git</text>

      <rect x="120" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="150" y="14" class="font-sans tag" font-size="11" text-anchor="middle">GitHub</text>

      <rect x="190" y="0" width="55" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="217" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Vercel</text>

      <rect x="255" y="0" width="60" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="285" y="14" class="font-sans tag" font-size="11" text-anchor="middle">VS Code</text>

      <rect x="325" y="0" width="50" height="20" rx="3" fill="#222" stroke="#333" />
      <text x="350" y="14" class="font-sans tag" font-size="11" text-anchor="middle">Linux</text>
    </g>
  </g>
</svg>
