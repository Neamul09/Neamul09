<svg width="800" height="185" viewBox="0 0 800 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="800" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="800" height="185" rx="10" fill="url(#avatar-bg)" stroke="#262626" stroke-width="1" />

  <!-- Section Title -->
  <text x="400" y="36" fill="#FFFFFF" class="font-heavy" font-size="22" text-anchor="middle" letter-spacing="1">Who's Watching?</text>

  <!-- Profile 1: Founder (Red) -->
  <g transform="translate(110, 55)">
    <rect width="80" height="80" rx="8" fill="#E50914" />
    <circle cx="28" cy="30" r="5" fill="#FFFFFF" />
    <circle cx="52" cy="30" r="5" fill="#FFFFFF" />
    <path d="M 24 50 Q 40 64 56 50" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <text x="40" y="100" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="13" text-anchor="middle">Neon</text>
    <text x="40" y="115" fill="#888888" class="font-sans" font-size="10.5" text-anchor="middle">Founder</text>
  </g>

  <!-- Profile 2: Builder / CS Engineer (Cyan) -->
  <g transform="translate(270, 55)">
    <rect width="80" height="80" rx="8" fill="#0080FF" />
    <circle cx="28" cy="30" r="5" fill="#FFFFFF" />
    <circle cx="52" cy="30" r="5" fill="#FFFFFF" />
    <rect x="20" y="24" width="16" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <rect x="44" y="24" width="16" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="36" y1="30" x2="44" y2="30" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 26 50 Q 40 62 54 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <text x="40" y="100" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="13" text-anchor="middle">Builder</text>
    <text x="40" y="115" fill="#888888" class="font-sans" font-size="10.5" text-anchor="middle">CS Engineer</text>
  </g>

  <!-- Profile 3: Student (Purple) -->
  <g transform="translate(430, 55)">
    <rect width="80" height="80" rx="8" fill="#8B5CF6" />
    <circle cx="28" cy="30" r="5" fill="#FFFFFF" />
    <circle cx="52" cy="30" r="5" fill="#FFFFFF" />
    <path d="M 40 12 L 62 20 L 40 28 L 18 20 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 26 50 Q 40 62 54 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <text x="40" y="100" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="13" text-anchor="middle">Student</text>
    <text x="40" y="115" fill="#888888" class="font-sans" font-size="10.5" text-anchor="middle">New Govt. College</text>
  </g>

  <!-- Profile 4: Researcher (Amber) -->
  <g transform="translate(590, 55)">
    <rect width="80" height="80" rx="8" fill="#D97706" />
    <circle cx="28" cy="30" r="5" fill="#FFFFFF" />
    <circle cx="52" cy="30" r="5" fill="#FFFFFF" />
    <path d="M 26 50 Q 40 62 54 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <text x="40" y="100" fill="#E5E5E5" class="font-sans" font-weight="700" font-size="13" text-anchor="middle">Researcher</text>
    <text x="40" y="115" fill="#888888" class="font-sans" font-size="10.5" text-anchor="middle">Elsevier Author</text>
  </g>
</svg>
